services:
  - type: web
    name: smeta-ai-backend
    runtime: python
    rootDir: backend
    pythonVersion: "3.12.0"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/fix_production_db.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: USER_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: 'https://smeta-ai.onrender.com'

  - type: static
    name: smeta-ai
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: 'https://smeta-ai-backend.onrender.com'
