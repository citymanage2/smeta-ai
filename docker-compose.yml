# Прод-топология для Timeweb App Platform (Docker Compose) — КОРНЕВОЙ файл деплоя.
# Timeweb App Platform читает строго docker-compose.yml в корне репозитория.
# Локальная разработка — в docker-compose.dev.yml (docker compose -f docker-compose.dev.yml up).
#
# Один App = web (первый, получает домен) + worker. База — ТОЛЬКО managed
# PostgreSQL (DBaaS): контейнерный Postgres на платформе запрещён (нет volumes).
# Запрещены volumes/privileged/network_mode:host — здесь их нет.
#
# Порядок первого деплоя: web на старте применяет миграции (alembic upgrade head
# в CMD Dockerfile), worker миграции НЕ гонит и терпит недоступность БД до готовности
# (poll-loop ретраит claim). Секреты задаются в панели Timeweb (env).
# Все переменные окружения ниже — через ${VAR:-} (пустой дефолт). На Timeweb App
# Platform реальные значения инжектятся в контейнер на рантайме из панели, а на
# фазе build/teardown их нет — без дефолта compose сыпал предупреждениями
# "The X variable is not set. Defaulting to a blank string" (шум, вводит в
# заблуждение). Пустой дефолт их убирает и рантайм не меняет. Обязательность
# секретов проверяет само приложение (pydantic settings) — упадёт с внятной ошибкой.
services:
  web:
    build: ./backend
    # Упавший контейнер должен вставать сам. 29–30.07.2026 worker умер и не
    # поднялся: очередь стояла 9 часов, задачи висели в «Ожидании», а вернуть
    # сервис к жизни можно было только через панель.
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Посредник для обхода геоблока Anthropic с РФ-IP (пусто → напрямую).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_PROXY_SECRET: ${ANTHROPIC_PROXY_SECRET:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      USERS: ${USERS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "8000:8000"
    # CMD из Dockerfile: alembic upgrade head && uvicorn (мигрирует только web).

  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Посредник для обхода геоблока Anthropic с РФ-IP (worker гоняет ИИ-обработку).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_PROXY_SECRET: ${ANTHROPIC_PROXY_SECRET:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      USERS: ${USERS:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      ANTHROPIC_MAX_CONCURRENCY: ${ANTHROPIC_MAX_CONCURRENCY:-6}
      FAST_CHUNK_CONCURRENCY: ${FAST_CHUNK_CONCURRENCY:-4}
      # Суммарно web+worker ≤ 21 соединения (было 31). Потолок обязан влезать в
      # max_connections managed-БД — в логе 29.07.2026 она отвечала отказом на
      # новое соединение. Занятые/разрешённые видно в «Диагностике» админки.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-6}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      WORKER_RSS_WARN_MB: ${WORKER_RSS_WARN_MB:-1024}
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    # Обработка задач: без alembic, без веб-порта. SIGTERM → graceful drain.
    command: python -m app.worker
    # Дефолт Docker — 10 с, этого не хватает: worker дренирует текущие job
    # JOB_DRAIN_TIMEOUT_S=20 с, затем отменяет обработчики и возвращает их job в
    # очередь, не списывая попытку. При грейсе 10 с SIGKILL прилетал бы посреди
    # дренажа, и деплой снова сжигал бы попытки (см. plans/2026-07-29-…).
    stop_grace_period: 30s
